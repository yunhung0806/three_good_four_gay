<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微光咖啡館 LUMINA CAFÉ</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div><small>LUMINA CAFÉ · <span id="mode">連線中</span></small><h1>微光咖啡館</h1></div><div id="stats"></div></header><div class="layout"><section class="world"><div class="scenehead"><h2 id="sceneName"></h2><span id="clock"></span></div><div id="map" aria-label="遊戲地圖"></div><div id="hint"></div><div class="controls">WASD / 方向鍵：移動　 E：互動　 Esc：關閉對話 <span><button id="interact">互動 E</button><button id="rest">結束今天</button></span></div></section><aside><h2>三好四給實踐</h2><div id="principles" class="principles"></div><h2>善意傳播網路</h2><svg id="network" viewBox="0 0 280 180" role="img" aria-label="善意傳播網路"></svg><p class="note">線條表示遊戲內的事件傳播。</p><h2>生活日誌</h2><div id="journal"></div><h2>善意的連結</h2><div id="links"></div><p class="note" id="modeNote">AI 狀態載入中。</p><button id="restart">重新遊玩</button></aside></div><div id="dialog" class="hidden" role="dialog" aria-modal="true"><div class="portrait"><div id="portraitArt"></div></div><div class="dialogBody"><button id="close" class="close">×</button><small id="speakerRole"></small><h2 id="speaker"></h2><p id="speech"></p><div id="conversation"></div><form id="talkForm"><input id="talk" autocomplete="off" placeholder="輸入你想說的話，或描述你的行動……" maxlength="180"><button>送出 ↵</button></form><p class="note" id="dialogHelp">Enter 送出 · Esc 離開</p></div></div></main><script src="src/diagnostics.js"></script><script src="src/world.js"></script><script src="src/story.js"></script><script src="src/npc-actions.js"></script><script src="src/endings.js"></script><script src="game.js"></script></body></html>
